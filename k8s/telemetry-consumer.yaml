apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-consumer
  namespace: devops
  labels:
    app.kubernetes.io/name: telemetry-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-consumer
    spec:
      restartPolicy: Always
      containers:
        - name: telemetry-consumer
          image: iot-control-api:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - scripts/consumer.py
          envFrom:
            - secretRef:
                name: control-api-env
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9093
            - name: KAFKA_TOPIC
              value: sensor-telemetry
            - name: KAFKA_GROUP_ID
              value: telemetry-postgres-writer
            - name: KAFKA_MAX_MESSAGES
              value: "0"
            - name: DB_HOST
              value: host.docker.internal
            - name: DB_PORT
              value: "5434"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
