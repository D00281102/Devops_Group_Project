apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-api-ingress
  namespace: devops
spec:
  ingressClassName: t-traefik
  rules:
    - http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: control-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 8000