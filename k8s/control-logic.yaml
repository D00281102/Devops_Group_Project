apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-logic
  namespace: devops
  labels:
    app.kubernetes.io/name: control-logic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-logic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-logic
    spec:
      restartPolicy: Always
      containers:
        - name: control-logic
          image: iot-control-logic:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: control-api-env
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9093
            - name: KAFKA_TOPIC
              value: sensor-telemetry
            - name: KAFKA_COMMAND_TOPIC
              value: actuator-commands
            - name: MQTT_BROKER
              value: mosquitto
            - name: MQTT_PORT
              value: "1883"
            - name: DB_HOST
              value: host.docker.internal
            - name: DB_PORT
              value: "5434"
            - name: CONTROL_DB_HOST
              value: host.docker.internal
            - name: CONTROL_DB_PORT
              value: "5434"
            - name: CONTROL_DB_NAME
              value: postgres
            - name: CONTROL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: control-api-env
                  key: DB_USER
            - name: CONTROL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-api-env
                  key: DB_PASSWORD
            - name: AUTH_DB_HOST
              value: host.docker.internal
            - name: AUTH_DB_PORT
              value: "5434"
            - name: PROCESS_HISTORICAL_TELEMETRY
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
