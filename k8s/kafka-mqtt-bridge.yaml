apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-mqtt-bridge
  namespace: devops
  labels:
    app.kubernetes.io/name: kafka-mqtt-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-mqtt-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-mqtt-bridge
    spec:
      restartPolicy: Always
      containers:
        - name: kafka-mqtt-bridge
          image: iot-kafka-mqtt-bridge:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9093
            - name: KAFKA_COMMAND_TOPIC
              value: actuator-commands
            - name: MQTT_BROKER
              value: mosquitto
            - name: MQTT_PORT
              value: "1883"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
