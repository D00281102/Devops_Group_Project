apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: devops
  labels:
    app.kubernetes.io/name: control-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-api
    spec:
      containers:
        - name: control-api
          image: iot-control-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: control-api-env
          env:
            - name: DB_HOST
              value: host.docker.internal
            - name: DB_PORT
              value: "5434"
            - name: CONTROL_DB_HOST
              value: host.docker.internal
            - name: CONTROL_DB_PORT
              value: "5434"
            - name: CONTROL_DB_NAME
              value: postgres
            - name: AUTH_DB_HOST
              value: host.docker.internal
            - name: AUTH_DB_PORT
              value: "5434"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
  namespace: devops
spec:
  selector:
    app.kubernetes.io/name: control-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
