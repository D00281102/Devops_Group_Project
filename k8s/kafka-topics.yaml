apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: devops
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: iot-control-api:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - >-
              from kafka import KafkaAdminClient;
              from kafka.admin import NewTopic;
              admin = KafkaAdminClient(bootstrap_servers="kafka:9093");
              topics = [
              NewTopic(name="sensor-telemetry", num_partitions=1, replication_factor=1),
              NewTopic(name="actuator-commands", num_partitions=1, replication_factor=1)
              ];
              existing = set(admin.list_topics());
              missing = [topic for topic in topics if topic.name not in existing];
              admin.create_topics(new_topics=missing) if missing else None;
              admin.close()
