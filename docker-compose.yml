services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -X -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT NOT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-init:
    image: postgres:17
    command: ["bash", "/init/init-databases.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
      DB_NAME: ${DB_NAME:-postgres}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
    volumes:
      - ./Prototype/database:/schema:ro
      - ./Prototype/migrations/002_combined_control_db_schema.sql:/migrations/002_combined_control_db_schema.sql:ro
      - ./Prototype/scripts/init-databases.sh:/init/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./Prototype/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native
    ports:
      - "9092:9092"
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:main
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy

  mqtt-kafka-bridge:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.mqtt-kafka
    image: iot-mqtt-kafka-bridge:latest
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: sensor-telemetry
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: sensors/telemetry
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./Prototype/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Prototype/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_DATASOURCE_USER: ${DB_USER:-postgres}
      GF_DATASOURCE_NAME: ${DB_NAME:-postgres}
      GF_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
    restart: unless-stopped

  control-logic:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.control
    image: iot-control-logic:latest
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: postgres
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
      CONTROL_DB_USER: ${DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
    depends_on:
      database-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  sensor-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.sensor
    image: iot-sensor-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_started

  actuator-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.actuator
    image: iot-actuator-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_started

  control-api:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.api
    image: iot-control-api:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: postgres
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
      CONTROL_DB_USER: ${DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
      AUTH_DB_USER: ${DB_USER:-postgres}
      AUTH_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in Prototype/.env}
    depends_on:
      database-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  grafana-data:
