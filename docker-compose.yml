services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
    - ./Prototype/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
  kafka:
    image: apache/kafka-native
    ports:
      - "9092:9092"
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:main
    ports:
      - 8081:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy

  kafka-connect:
    build:
      context: .
      dockerfile: Dockerfile.kafka-connect
    image: iot-kafka-connect:7.5.8
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9093
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    depends_on:
      kafka:
        condition: service_healthy
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./Prototype/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Prototype/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_DATASOURCE_PASSWORD: ${GF_DATASOURCE_PASSWORD}
    restart: unless-stopped

  control-logic:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.control
    image: iot-control-logic:latest
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: sensor-telemetry
      KAFKA_COMMAND_TOPIC: actuator-commands
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DB_HOST: iot-postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: iot-postgres
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_NAME: control_settings_db
      CONTROL_DB_USER: ${CONTROL_DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started
  kafka-mqtt-bridge:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.bridge
    image: iot-kafka-mqtt-bridge:latest
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_COMMAND_TOPIC: actuator-commands
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started

  sensor-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.sensor
    image: iot-sensor-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      BUILDING_ID: "1"
      DATASET_PATH: data/iot_telemetry_data.csv
    depends_on:
      mosquitto:
        condition: service_started

  sensor-simulator-building-2:
    image: iot-sensor-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      BUILDING_ID: "2"
      DATASET_PATH: data/building_2.csv
    depends_on:
      mosquitto:
        condition: service_started
  actuator-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.actuator
    image: iot-actuator-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_started


  control-api:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.api
    image: iot-control-api:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: host.docker.internal
      CONTROL_DB_PORT: "${AUTH_DB_PORT:-5436}"
      CONTROL_DB_NAME: ${AUTH_DB_NAME:-scrum108_test_db}
      CONTROL_DB_USER: ${AUTH_DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in your local .env file}

      AUTH_DB_HOST: ${AUTH_DB_HOST:?Set AUTH_DB_HOST in your local .env file}
      AUTH_DB_PORT: ${AUTH_DB_PORT:-5436}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-scrum108_test_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in your local .env file}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in your local .env file}

  telemetry-consumer:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.api
    image: iot-control-api:latest
    command: ["python", "-u", "scripts/consumer.py"]
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: sensor-telemetry
      KAFKA_GROUP_ID: telemetry-postgres-writer
      KAFKA_MAX_MESSAGES: "0"
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    depends_on:
      kafka:
        condition: service_healthy


volumes:
  grafana-data:
