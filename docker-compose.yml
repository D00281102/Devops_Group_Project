services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Prototype/.env}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./Prototype/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native
    ports:
      - "9092:9092"
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:main
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.8
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9093
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/java/mqtt
    volumes:
      - type: bind
        source: C:/kafka/plugins
        target: /usr/share/java/mqtt
        read_only: true
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./Prototype/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Prototype/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_DATASOURCE_PASSWORD: ${GF_DATASOURCE_PASSWORD:-${DB_PASSWORD}}
    restart: unless-stopped

  control-logic:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.control
    image: iot-control-logic:latest
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: host.docker.internal
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
      CONTROL_DB_USER: ${CONTROL_DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-${DB_PASSWORD}}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  sensor-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.sensor
    image: iot-sensor-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_started

  actuator-simulator:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.actuator
    image: iot-actuator-simulator:latest
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_started

  control-api:
    build:
      context: ./Prototype
      dockerfile: Dockerfile.api
    image: iot-control-api:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      CONTROL_DB_HOST: host.docker.internal
      CONTROL_DB_PORT: "${CONTROL_DB_PORT:-5432}"
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-control_settings_db}
      CONTROL_DB_USER: ${CONTROL_DB_USER:-postgres}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-${DB_PASSWORD}}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana-data:
