name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-only-placeholder
      CONTROL_DB_PASSWORD: ci-only-placeholder
      AUTH_DB_PASSWORD: ci-only-placeholder
      AUTH_SECRET_KEY: ci-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test sensor analytics
        run: python test_sensor_analytics.py

      - name: Test control logic
        run: python test_control_logic.py

  docker-build:
    name: Build ${{ matrix.image }} image
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-api
            dockerfile: Dockerfile.api
          - image: control-logic
            dockerfile: Dockerfile.control
          - image: sensor-simulator
            dockerfile: Dockerfile.sensor
          - image: actuator-simulator
            dockerfile: Dockerfile.actuator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: >-
          docker build
          --file "Prototype/${{ matrix.dockerfile }}"
          --tag "devops-group-project/${{ matrix.image }}:${{ github.sha }}"
          Prototype
