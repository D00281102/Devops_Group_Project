name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-only-placeholder
      CONTROL_DB_PASSWORD: ci-only-placeholder
      AUTH_DB_PASSWORD: ci-only-placeholder
      AUTH_SECRET_KEY: ci-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test sensor analytics
        run: python test_sensor_analytics.py

      - name: Test control logic
        run: python test_control_logic.py

  docker-build:
    name: Build ${{ matrix.image }} image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-api
            dockerfile: Dockerfile.api
          - image: control-logic
            dockerfile: Dockerfile.control
          - image: sensor-simulator
            dockerfile: Dockerfile.sensor
          - image: actuator-simulator
            dockerfile: Dockerfile.actuator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish Docker image
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner}/devops-group-project-${IMAGE}"
          image_tag="${image_name}:${GITHUB_SHA}"

          docker build \
            --file "Prototype/${DOCKERFILE}" \
            --tag "$image_tag" \
            Prototype

          if [ "$GITHUB_REPOSITORY" = "D00281102/Devops_Group_Project" ] \
            && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            printf '%s' "$GHCR_TOKEN" \
              | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker tag "$image_tag" "${image_name}:latest"
            docker push "$image_tag"
            docker push "${image_name}:latest"
          fi

  deploy:
    name: Deploy to Kubernetes
    needs: docker-build
    if: >-
      github.repository == 'D00281102/Devops_Group_Project' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "Configure the KUBE_CONFIG secret in the production environment." >&2
            exit 1
          fi
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl config current-context

      - name: Apply Kubernetes manifests
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          kubectl apply -f k8s/namespace.yaml
          sed \
            -e "s|__IMAGE_OWNER__|${owner}|g" \
            -e "s|__IMAGE_TAG__|${GITHUB_SHA}|g" \
            k8s/applications.yaml.tmpl \
            | kubectl apply -f -

      - name: Verify rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          for deployment in control-api control-logic; do
            kubectl rollout status "deployment/${deployment}" \
              --namespace iot-app \
              --timeout=180s
          done
