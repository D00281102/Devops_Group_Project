name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-only-placeholder
      CONTROL_DB_PASSWORD: ci-only-placeholder
      AUTH_DB_PASSWORD: ci-only-placeholder
      AUTH_SECRET_KEY: ci-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test sensor analytics
        run: python test_sensor_analytics.py

      - name: Test control logic
        run: python test_control_logic.py

      - name: Test Kafka startup
        run: python test_start_kafka.py

      - name: Test MQTT-to-Kafka bridge
        run: python test_mqtt_kafka_bridge.py

      - name: Smoke-test building API imports
        run: python -c "import api.buildings"

  docker-build:
    name: Build ${{ matrix.image }} image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-api
            dockerfile: Dockerfile.api
          - image: control-logic
            dockerfile: Dockerfile.control
          - image: sensor-simulator
            dockerfile: Dockerfile.sensor
          - image: actuator-simulator
            dockerfile: Dockerfile.actuator
          - image: mqtt-kafka-bridge
            dockerfile: Dockerfile.mqtt-kafka
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish Docker image
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner}/devops-group-project-${IMAGE}"
          image_tag="${image_name}:${GITHUB_SHA}"

          docker build \
            --file "Prototype/${DOCKERFILE}" \
            --tag "$image_tag" \
            Prototype

          if [ "$GITHUB_REPOSITORY" = "D00281102/Devops_Group_Project" ] \
            && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            printf '%s' "$GHCR_TOKEN" \
              | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker tag "$image_tag" "${image_name}:latest"
            docker push "$image_tag"
            docker push "${image_name}:latest"
          fi

  update-gitops:
    name: Update GitOps image tags
    needs: docker-build
    if: >-
      github.repository == 'D00281102/Devops_Group_Project' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Record published image tags in Git
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          update_image() {
            local file="$1"
            local image="$2"
            local expected
            local matches

            if [ ! -f "$file" ]; then
              echo "Expected deployment manifest not found: ${file}" >&2
              exit 1
            fi

            expected="^[[:space:]]*image:[[:space:]]*(iot-${image}:local|ghcr[.]io/${owner}/devops-group-project-${image}:[^[:space:]]+)$"
            matches="$(grep -Ec "$expected" "$file" || true)"
            if [ "$matches" -ne 1 ]; then
              echo "Expected exactly one local or GHCR image for ${image} in ${file}; found ${matches}." >&2
              exit 1
            fi

            sed -i -E \
              "s#^([[:space:]]*image:[[:space:]]*)(iot-${image}:local|ghcr[.]io/${owner}/devops-group-project-${image}:[^[:space:]]+)#\1ghcr.io/${owner}/devops-group-project-${image}:${GITHUB_SHA}#" \
              "$file"
            matches="$(grep -Ec "^[[:space:]]*image:[[:space:]]*ghcr[.]io/${owner}/devops-group-project-${image}:${GITHUB_SHA}$" "$file" || true)"
            if [ "$matches" -ne 1 ]; then
              echo "Expected exactly one updated image reference for ${image} in ${file}; found ${matches}." >&2
              exit 1
            fi
          }

          update_image k8s/control-api.yaml control-api
          update_image k8s/control-logic.yaml control-logic

          if git diff --quiet -- k8s/control-api.yaml k8s/control-logic.yaml; then
            echo "GitOps image tags already match ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/control-api.yaml k8s/control-logic.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
