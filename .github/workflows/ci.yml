name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-only-placeholder
      CONTROL_DB_PASSWORD: ci-only-placeholder
      AUTH_DB_PASSWORD: ci-only-placeholder
      AUTH_SECRET_KEY: ci-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test sensor analytics
        run: python test_sensor_analytics.py

      - name: Test control logic
        run: python test_control_logic.py

  docker-build:
    name: Build ${{ matrix.image }} image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-api
            dockerfile: Dockerfile.api
          - image: control-logic
            dockerfile: Dockerfile.control
          - image: sensor-simulator
            dockerfile: Dockerfile.sensor
          - image: actuator-simulator
            dockerfile: Dockerfile.actuator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish Docker image
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner}/devops-group-project-${IMAGE}"
          image_tag="${image_name}:${GITHUB_SHA}"

          docker build \
            --file "Prototype/${DOCKERFILE}" \
            --tag "$image_tag" \
            Prototype

          if [ "$GITHUB_REPOSITORY" = "D00281102/Devops_Group_Project" ] \
            && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            printf '%s' "$GHCR_TOKEN" \
              | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker tag "$image_tag" "${image_name}:latest"
            docker push "$image_tag"
            docker push "${image_name}:latest"
          fi

  update-gitops:
    name: Update GitOps image tags
    needs: docker-build
    if: >-
      github.repository == 'D00281102/Devops_Group_Project' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Record published image tags in Git
        run: |
          set -euo pipefail
          sed -i -E "s/(newTag: ).*/\1${GITHUB_SHA}/" k8s/kustomization.yaml
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "GitOps image tags already match ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
